site_name: Nexus - Obsidian + Claude Second Brain
site_description: Knowledge management architecture template for academic researchers
site_author: Data-Wise
site_url: https://data-wise.github.io/nexus/

repo_name: Data-Wise/nexus
repo_url: https://github.com/Data-Wise/nexus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  favicon: assets/nexus-icon.svg
  logo: assets/nexus-logo.svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quickstart.md
      - Obsidian Setup: getting-started/obsidian-quickstart.md
  - Architecture:
      - Overview: architecture/overview.md
      - Obsidian + Claude Brain: architecture/obsidian-claude-brain.md
      - Monorepo Decision: architecture/monorepo-decision.md
  - Claude Integration:
      - System Prompt: claude-integration/system-prompt.md
      - Obsidian Prompt: claude-integration/obsidian-prompt.md
  - Advanced:
      - Integration Analysis: INTEGRATION-ANALYSIS-2025-01-11.md
      - Architecture Commands: reference/architecture-commands.md
  - Project Hub: project-hub.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Data-Wise/nexus
    - icon: fontawesome/brands/github
      link: https://github.com/Data-Wise/claude-statistical-research-mcp
      name: MCP Server

copyright: Copyright &copy; 2025 Data-Wise
